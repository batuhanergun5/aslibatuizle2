services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - rooms:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
volumes:
  rooms:
  certificates:
  caddy_config:
